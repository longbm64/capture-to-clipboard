name: Build macOS (.dmg / .app) & Windows (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS (ChupManHinh.app & .dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with Tkinter
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build ChupManHinh.app & ChupManHinh-macOS.dmg
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: Upload macOS DMG & App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChupManHinh-macOS-Installer
          path: |
            dist/ChupManHinh-macOS.dmg
            dist/ChupManHinh-macOS-App.zip

  build-windows:
    name: Build Windows (ChupManHinh.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies & Build EXE
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -c "from app.tray import ensure_logo_assets; ensure_logo_assets()"
          python -m PyInstaller --noconfirm --clean --noconsole --onefile --name "ChupManHinh" --icon "assets/logo.ico" --add-data "assets;assets" --hidden-import "pystray._win32" --hidden-import "pynput.keyboard._win32" --hidden-import "pynput.mouse._win32" main.py

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChupManHinh-Windows-Portable
          path: dist/ChupManHinh.exe
