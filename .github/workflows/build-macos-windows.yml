name: Build Windows C++ (.exe) & macOS (.dmg / .app)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Native C++ (CaptureToClipboard.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Native C++ EXE
        run: |
          cmd /c build_windows.bat

      - name: Run Self-Test
        run: |
          .\dist\CaptureToClipboard.exe --self-test | Out-Host

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaptureToClipboard-Windows-Portable
          path: dist/CaptureToClipboard.exe

  build-macos:
    name: Build macOS (Capture To Clipboard.app & .dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with Tkinter
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Capture To Clipboard.app & .dmg
        working-directory: old-code
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: Upload macOS DMG & App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaptureToClipboard-macOS-Installer
          path: |
            old-code/dist/CaptureToClipboard-macOS.dmg
            old-code/dist/CaptureToClipboard-macOS-App.zip
